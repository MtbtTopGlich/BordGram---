    .call-status { opacity: 0.7; margin-bottom: 20px; }
    .call-timer { font-size: 30px; margin-bottom: 28px; }

    .call-end { background: var(--danger); color: #fff; }

    }

<script>

  const ADMIN = { email: "dimakuleshov928@gmail.com", pass: "09823065890dD", user: "BordGram" };

  // Звуки (создаем с проверкой)
  function createSound(freq, type, duration) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.value = 0.3;
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + duration);
    } catch(e) {}
  }

  function playSoundSend() { createSound(800, 'sine', 0.15); }
  function playSoundReceive() { createSound(600, 'sine', 0.2); setTimeout(() => createSound(800, 'sine', 0.15), 150); }
  function playSoundRing() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = 440;
      gain.gain.value = 0.2;
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.5);
      setTimeout(() => {
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'square';
        osc2.frequency.value = 480;
        gain2.gain.value = 0.2;
        gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(ctx.currentTime);
        osc2.stop(ctx.currentTime + 0.5);
      }, 600);
    } catch(e) {}
  }

  const savedTheme = localStorage.getItem('bg_theme') || 'default';
  if (savedTheme !== 'default') document.documentElement.setAttribute('data-theme', savedTheme);

  auth.onAuthStateChanged(async (u) => {
    if (u) {
      const d = await db.collection('users').doc(u.uid).get();
      if (d.exists) {
        cur = { ...d.data(), uid: u.uid };
        if (cur.isBanned) { await auth.signOut(); showLogin(); return; }
        db.collection('users').doc(u.uid).update({ online: true, lastSeen: firebase.firestore.FieldValue.serverTimestamp() });
        showApp();
        listenForCalls();
      }
    } else { showLogin(); }
  });

  window.addEventListener('beforeunload', () => {
    if (cur?.uid) db.collection('users').doc(cur.uid).update({ online: false, lastSeen: firebase.firestore.FieldValue.serverTimestamp() });
  });

  function avHTML(u, sz = 's') {
    const c = sz === 's' ? 'ch-av' : sz === 'm' ? 'av' : sz === 'msg' ? 'msg-av' : 'ch-av';
    const cl = sz === 's' ? 'ch-av-l' : sz === 'm' ? 'av-l' : sz === 'msg' ? 'msg-av-l' : 'ch-av-l';
    if (u?.avatar) return `<img src="${u.avatar}" class="${c}">`;
    return `<div class="${cl}">${(u?.nickname || u?.username || '?')[0].toUpperCase()}</div>`;
  }

  function onlineStatus(u) {
    if (u?.online) return '<span class="online">● В сети</span>';
    return '<span class="offline">● Не в сети</span>';
  }

  function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
  function toast(m, t = 'ok') { const e = document.querySelector('.toast'); if (e) e.remove(); const n = document.createElement('div'); n.className = `toast ${t}`; n.textContent = m; document.body.appendChild(n); setTimeout(() => n.remove(), 2500); }
  function fmt(ts) { if (!ts) return ''; return new Date(ts).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }); }

  function showLogin() {
    document.getElementById('app').innerHTML = `
      <div style="max-width:420px;width:100%;background:var(--bg);border-radius:28px;padding:36px;box-shadow:0 25px 80px rgba(0,0,0,0.25);margin:16px;">
        <div style="text-align:center;margin-bottom:24px;"><h2>BordGram</h2></div>
        <div class="input-group"><label>Email</label><input id="le"><div class="error" id="lee"></div></div>

        <div class="error" id="ler"></div>

        <button class="btn btn-s" style="margin-top:8px;" onclick="showReg()">Регистрация</button>
        <button class="btn" style="margin-top:8px;background:#fff;color:#333;border:1px solid #ddd;" onclick="googleLogin()">Google</button>
      </div>`;
  }

  function showReg() {
    document.getElementById('app').innerHTML = `
      <div style="max-width:420px;width:100%;background:var(--bg);border-radius:28px;padding:36px;box-shadow:0 25px 80px rgba(0,0,0,0.25);margin:16px;">
        <div style="text-align:center;margin-bottom:20px;"><h2>Регистрация</h2></div>
        <div class="input-group"><label>Username</label><input id="ru"><div class="error" id="rue"></div></div>
        <div class="input-group"><label>Имя</label><input id="rn"><div class="error" id="rne"></div></div>
        <div class="input-group"><label>Email</label><input id="re"><div class="error" id="ree"></div></div>
        <div class="input-group"><label>Пароль</label><input type="password" id="rp"><div class="error" id="rpe"></div></div>
        <div class="error" id="rerr"></div>
        <button class="btn btn-p" onclick="doReg()">Зарегистрироваться</button>
        <p style="text-align:center;margin-top:14px;"><a onclick="showLogin()" style="color:var(--primary);cursor:pointer;">Войти</a></p>
      </div>`;
  }

  window.doLogin = async () => {
    const e = document.getElementById('le').value.trim(), p = document.getElementById('lp').value.trim();
    document.querySelectorAll('.error').forEach(el => el.classList.remove('show'));
    if (!e || !p) { document.getElementById('ler').textContent = 'Заполните поля'; document.getElementById('ler').classList.add('show'); return; }
    try { await auth.signInWithEmailAndPassword(e, p); } catch(er) { document.getElementById('ler').textContent = 'Ошибка'; document.getElementById('ler').classList.add('show'); }
  };

  window.doReg = async () => {
    const u = document.getElementById('ru').value.trim(), n = document.getElementById('rn').value.trim();
    const e = document.getElementById('re').value.trim(), p = document.getElementById('rp').value.trim();
    document.querySelectorAll('.error').forEach(el => el.classList.remove('show'));
    if (!u || u.length < 3 || !n || !e || !p || p.length < 6) { document.getElementById('rerr').textContent = 'Заполните поля'; document.getElementById('rerr').classList.add('show'); return; }
    const snap = await db.collection('users').where('username', '==', u).limit(1).get();
    if (!snap.empty) { document.getElementById('rue').textContent = 'Занято'; document.getElementById('rue').classList.add('show'); return; }
    try {
      const isAd = e === ADMIN.email;
      const r = await auth.createUserWithEmailAndPassword(e, p);
      await db.collection('users').doc(r.user.uid).set({ username: u, nickname: n, email: e, avatar: '', bio: '', isAdmin: isAd, isVerified: isAd, isBanned: false, online: true, lastSeen: firebase.firestore.FieldValue.serverTimestamp(), createdAt: new Date().toISOString() });
    } catch(er) { document.getElementById('rerr').textContent = 'Ошибка'; document.getElementById('rerr').classList.add('show'); }
  };

  window.googleLogin = async () => {
    try {
      const r = await auth.signInWithPopup(googleProvider);
      const d = await db.collection('users').doc(r.user.uid).get();
      if (!d.exists) {
        const isAd = r.user.email === ADMIN.email;
        await db.collection('users').doc(r.user.uid).set({ email: r.user.email, username: isAd ? ADMIN.user : r.user.email.split('@')[0], nickname: r.user.displayName || r.user.email.split('@')[0], avatar: r.user.photoURL || '', bio: '', isAdmin: isAd, isVerified: isAd, isBanned: false, online: true, lastSeen: firebase.firestore.FieldValue.serverTimestamp(), createdAt: new Date().toISOString() });
      }
    } catch(e) { toast('Ошибка Google', 'err'); }
  };

  function showApp() {
    if (!cur) return;
    const isAd = cur.isAdmin || cur.email === ADMIN.email;
    document.getElementById('app').innerHTML = `
      <div class="app">
        <div class="sidebar">
          <div class="sb-header">

          </div>
          <div id="friendReqs" style="padding:0 12px;"></div>
          <div class="chat-list" id="chatList"><p style="text-align:center;padding:20px;">Загрузка...</p></div>
          <div style="padding:12px;border-top:1px solid rgba(255,255,255,0.1);">
            ${isAd ? '<button class="btn btn-w" style="margin-bottom:6px;" onclick="openModal(\'adminModal\');loadAdmin();">Админ</button>' : ''}
            <button class="btn btn-s" onclick="logout()">Выйти</button>
          </div>
        </div>
        <div class="main" id="mainChat">
          <div class="ch-header">
            <div class="ch-partner" id="chPartner"><p>Выберите чат</p></div>
            <div style="display:flex;gap:6px;">
              <button class="ico-btn" id="callBtn" style="display:none;" onclick="startCall()">📞</button>
              <button class="ico-btn" onclick="openModal('addFriendModal')">➕</button>
              <button class="ico-btn" id="infoBtn" style="display:none;" onclick="showInfo()">ℹ️</button>
            </div>
          </div>
          <div class="msgs" id="msgs"><p style="text-align:center;padding:40px;">Начните общение</p></div>
          <div class="input-area" id="inputArea" style="display:none;">
            <input type="file" id="fileInput" style="display:none;" multiple>
            <button onclick="document.getElementById('fileInput').click()">📎</button>
            <input type="text" class="msg-input" id="msgInput" placeholder="Сообщение..." onkeypress="if(event.key==='Enter') sendMsg()">

        </div>
      </div>
      ${getModals(isAd)}`;
    attachListeners(isAd);
    loadChats();
    loadFriendReqs();
  }

  function getModals(isAd) {
    return `
      <div class="modal" id="addFriendModal"><div class="modal-inner"><div class="modal-head"><h3>Добавить друга</h3><button class="modal-close" onclick="closeModal('addFriendModal')">&times;</button></div>
        <div class="input-group"><label>Username</label><input id="friendU"></div>
        <div class="error" id="friendErr"></div><div id="friendRes"></div>
        <button class="btn btn-p" onclick="sendFriendReq()">Отправить заявку</button>
      </div></div>
      ${isAd ? `<div class="modal" id="adminModal"><div class="modal-inner" style="max-width:600px;"><div class="modal-head"><h3>Админ</h3><button class="modal-close" onclick="closeModal('adminModal')">&times;</button></div>
        <div style="display:flex;gap:8px;margin-bottom:14px;">
          <button class="btn btn-p" style="width:auto;" onclick="loadAdmin('users',this)">Польз.</button>
          <button class="btn btn-s" style="width:auto;" onclick="loadAdmin('banned',this)">Бан</button>
          <button class="btn btn-s" style="width:auto;" onclick="loadAdmin('reports',this)">Жалобы</button>
        </div>
        <div id="adminList"></div>
      </div></div>` : ''}
    `;
  }

  function attachListeners(isAd) {
    document.getElementById('infoBtn').onclick = () => { if (chat) showInfoPanel(chat.user); };
    document.getElementById('callBtn').onclick = () => { if (chat) startCall(chat.user); };
    document.getElementById('fileInput').onchange = (e) => handleFiles(e.target.files);
    document.getElementById('searchChats').oninput = (e) => {
      const q = e.target.value.toLowerCase();
      document.querySelectorAll('.ch').forEach(el => el.style.display = el.querySelector('.ch-name')?.textContent.toLowerCase().includes(q) ? 'flex' : 'none');
    };
    document.querySelectorAll('.modal').forEach(m => m.onclick = function(e) { if (e.target === m) m.classList.remove('show'); });
  }

  window.openModal = (id) => document.getElementById(id).classList.add('show');
  window.closeModal = (id) => document.getElementById(id).classList.remove('show');

  function loadChats() {
    if (!cur?.uid) return;
    if (chatListener) chatListener();
    chatListener = db.collection('chats').where('participants', 'array-contains', cur.uid)
      .onSnapshot(async (snap) => {
        const list = document.getElementById('chatList');
        if (!list) return;
        const seen = new Set();
        list.innerHTML = '';
        if (snap.empty) { list.innerHTML = '<p style="text-align:center;padding:30px;">Нет диалогов</p>'; return; }
        // Сортируем перед отрисовкой
        const docs = snap.docs.sort((a, b) => {
          const aTime = a.data().lastMessageTime || '0';
          const bTime = b.data().lastMessageTime || '0';
          return bTime.localeCompare(aTime);
        });
        for (const d of docs) {
          const dt = d.data();
          const oid = dt.participants.find(id => id !== cur.uid);
          if (!oid || seen.has(oid)) continue;
          seen.add(oid);
          const ud = await db.collection('users').doc(oid).get();
          if (!ud.exists) continue;
          const u = ud.data();
          if (u.isBanned) continue;
          const el = document.createElement('div');
          el.className = 'ch' + (chat?.id === d.id ? ' active' : '');
          el.innerHTML = `${avHTML(u,'s')}<div class="ch-info"><div class="ch-name">${esc(u.nickname||u.username)}</div><div class="ch-msg">${esc(dt.lastMessage||'')}</div></div>${dt.unread>0?`<span class="unread">${dt.unread}</span>`:''}`;
          el.onclick = () => openChat({ id: d.id, user: { ...u, uid: oid } });
          list.appendChild(el);
        }
      });
  }

  function openChat(c) {
    chat = c;
    document.getElementById('infoBtn').style.display = 'flex';
    document.getElementById('callBtn').style.display = 'flex';
    document.getElementById('chPartner').innerHTML = `<div style="display:flex;align-items:center;gap:10px;">${avHTML(c.user,'s')}<div><h3>${esc(c.user.nickname||c.user.username)}</h3>${onlineStatus(c.user)}</div></div>`;
    document.getElementById('inputArea').style.display = 'flex';
    loadMsgs(c.id);
    db.collection('chats').doc(c.id).update({ unread: 0 });
  }

  function loadMsgs(chatId) {
    if (msgListener) msgListener();
    const area = document.getElementById('msgs');
    area.innerHTML = '';
    msgListener = db.collection('chats').doc(chatId).collection('messages').orderBy('timestamp')
      .onSnapshot((snap) => {
        area.innerHTML = '';
        snap.forEach(doc => {
          const msg = doc.data();
          const w = document.createElement('div');
          w.className = 'msg-w ' + (msg.senderId === cur.uid ? 'sent' : 'received');
          const av = msg.senderId === cur.uid ? avHTML(cur, 'msg') : (chat ? avHTML(chat.user, 'msg') : '');
          const m = document.createElement('div');
          m.className = 'msg ' + (msg.senderId === cur.uid ? 'sent' : 'rec');
          let c = msg.type === 'image' ? `<img src="${msg.content}" style="max-width:200px;border-radius:12px;">` : esc(msg.content);
          c += `<div class="msg-time">${fmt(msg.timestamp)}</div>`;
          m.innerHTML = c;
          w.innerHTML = av;
          w.appendChild(m);
          area.appendChild(w);
        });
        area.scrollTop = area.scrollHeight;
      });
  }

  async function sendMsg() {
    const inp = document.getElementById('msgInput');
    const c = inp?.value?.trim();
    if (!c || !chat) return;
    await db.collection('chats').doc(chat.id).collection('messages').add({ senderId: cur.uid, content: c, type: 'text', timestamp: new Date().toISOString() });
    await db.collection('chats').doc(chat.id).update({ lastMessage: c, lastMessageTime: new Date().toISOString() });
    inp.value = '';
    playSoundSend();
  }
  window.sendMsg = sendMsg;

  async function handleFiles(files) {
    if (!files.length || !chat) return;
    for (const f of files) {
      const ref = storage.ref(`chats/${chat.id}/${Date.now()}_${f.name}`);
      await ref.put(f);
      const url = await ref.getDownloadURL();
      const t = f.type.startsWith('image/') ? 'image' : 'file';
      await db.collection('chats').doc(chat.id).collection('messages').add({ senderId: cur.uid, content: url, type: t, fileName: f.name, timestamp: new Date().toISOString() });
      await db.collection('chats').doc(chat.id).update({ lastMessage: t === 'image' ? '📷 Фото' : '📎 Файл', lastMessageTime: new Date().toISOString() });
    }
  }

  async function sendFriendReq() {
    const u = document.getElementById('friendU')?.value?.trim();
    const e = document.getElementById('friendErr'), r = document.getElementById('friendRes');
    if (!u) { e.textContent = 'Введите username'; e.classList.add('show'); return; }
    const snap = await db.collection('users').where('username', '==', u).limit(1).get();
    if (snap.empty) { e.textContent = 'Не найден'; e.classList.add('show'); return; }
    await db.collection('friendRequests').add({ fromUserId: cur.uid, toUserId: snap.docs[0].id, status: 'pending', createdAt: new Date().toISOString() });
    r.innerHTML = '<p style="color:var(--success);">Отправлена!</p>';
    setTimeout(() => closeModal('addFriendModal'), 2000);
  }
  window.sendFriendReq = sendFriendReq;

  function loadFriendReqs() {
    db.collection('friendRequests').where('toUserId','==',cur.uid).where('status','==','pending').onSnapshot(async (snap) => {
      const c = document.getElementById('friendReqs');
      if (!c) return;
      c.innerHTML = '';
      for (const d of snap.docs) {
        const r = d.data();
        const ud = await db.collection('users').doc(r.fromUserId).get();
        if (!ud.exists) continue;
        const u = ud.data();
        c.innerHTML += `<div class="friend-req"><div style="display:flex;align-items:center;gap:8px;">${avHTML(u,'s')}<strong>${esc(u.nickname||u.username)}</strong></div>
          <div><button class="btn-sm btn-ac" onclick="acceptReq('${d.id}')">✓</button></div></div>`;
      }
    });
    window.acceptReq = async (id) => {
      const r = (await db.collection('friendRequests').doc(id).get()).data();
      await db.collection('chats').add({ participants: [r.fromUserId, r.toUserId], lastMessage: '', lastMessageTime: new Date().toISOString(), unread: 0 });
      await db.collection('friendRequests').doc(id).update({ status: 'accepted' });
    };
  }

  function showInfoPanel(user) {
    alert(`${user.nickname || user.username}\n@${user.username}`);
  }

  // ========== ЗВОНКИ (ИСПРАВЛЕННЫЕ) ==========
  function listenForCalls() {
    db.collection('calls').where('toUserId', '==', cur.uid).where('status', '==', 'ringing')
      .onSnapshot((snap) => {
        snap.docChanges().forEach((change) => {
          if (change.type === 'added') {
            showIncomingCall(change.doc.id, change.doc.data());
          }
        });
      });
  }

  function showIncomingCall(callId, callData) {
    document.getElementById('callOverlay').innerHTML = `
      <div class="call-avatar">${avHTML({ nickname: callData.callerName }, 'm')}</div>
      <div class="call-name">${esc(callData.callerName)}</div>
      <div class="call-status">Входящий звонок...</div>
      <div class="call-controls">
        <button class="call-btn call-accept" id="acceptBtn"><i class="fas fa-phone"></i></button>
        <button class="call-btn call-end" id="declineBtn"><i class="fas fa-phone-slash"></i></button>
      </div>`;
    document.getElementById('callOverlay').classList.add('show');
    
    document.getElementById('acceptBtn').onclick = () => acceptCall(callId);
    document.getElementById('declineBtn').onclick = () => declineCall(callId);
    
    // Звук звонка
    playSoundRing();
    const ringInterval = setInterval(playSoundRing, 2000);
    window._ringInterval = ringInterval;
  }

  window.acceptCall = async (callId) => {
    if (window._ringInterval) clearInterval(window._ringInterval);
    document.getElementById('callOverlay').innerHTML = '<p style="color:#fff;">Подключение...</p>';
    
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
      
      callDoc = db.collection('calls').doc(callId);
      const callData = (await callDoc.get()).data();
      
      peerConnection = new RTCPeerConnection(servers);
      
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
      
      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          callDoc.collection('answerCandidates').add(event.candidate.toJSON());
        }
      };
      
      peerConnection.ontrack = (event) => {
        // Показываем удаленное видео
        document.getElementById('callOverlay').innerHTML = `
          <video id="remoteVideo" class="call-video" autoplay playsinline></video>
          <video id="localVideo" class="call-video local" autoplay muted playsinline></video>
          <div class="call-name">${esc(callData.callerName)}</div>
          <div class="call-status">Разговор</div>
          <div class="call-timer" id="callTimer">00:00</div>
          <div class="call-controls">
            <button class="call-btn call-mute" id="muteBtn"><i class="fas fa-microphone"></i></button>
            <button class="call-btn call-end"><i class="fas fa-phone-slash"></i></button>
          </div>`;
        document.getElementById('remoteVideo').srcObject = event.streams[0];
        document.getElementById('localVideo').srcObject = localStream;
        document.querySelector('#callOverlay .call-end').onclick = endCall;
        document.getElementById('muteBtn').onclick = toggleMute;
        startCallTimer();
      };
      
      if (callData.offer) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(callData.offer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        await callDoc.update({ answer: { type: answer.type, sdp: answer.sdp }, status: 'active' });
      }
      
      // Получаем ICE кандидатов звонящего
      callDoc.collection('offerCandidates').onSnapshot((snap) => {
        snap.docChanges().forEach(async (change) => {
          if (change.type === 'added' && peerConnection) {
            try {
              await peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
            } catch(e) {}
          }
        });
      });
      
    } catch(e) {
      console.error(e);
      toast('Ошибка подключения к звонку', 'err');
      endCall();
    }
  };

  window.declineCall = async (callId) => {
    if (window._ringInterval) clearInterval(window._ringInterval);
    await db.collection('calls').doc(callId).update({ status: 'declined' });
    document.getElementById('callOverlay').classList.remove('show');
    document.getElementById('callOverlay').innerHTML = '';
  };

  window.startCall = async (user) => {
    if (!user && !chat) return;
    const u = user || chat.user;
    
    document.getElementById('callOverlay').innerHTML = `
      <video id="remoteVideo" class="call-video" autoplay playsinline style="display:none;"></video>
      <video id="localVideo" class="call-video local" autoplay muted playsinline></video>
      <div class="call-name">${esc(u.nickname || u.username)}</div>
      <div class="call-status" id="callStatus">Звонок...</div>
      <div class="call-timer" id="callTimer">00:00</div>
      <div class="call-controls">
        <button class="call-btn call-mute" id="muteBtn"><i class="fas fa-microphone"></i></button>
        <button class="call-btn call-end" id="endCallBtn"><i class="fas fa-phone-slash"></i></button>
      </div>`;
    document.getElementById('callOverlay').classList.add('show');
    document.getElementById('muteBtn').onclick = toggleMute;
    document.getElementById('endCallBtn').onclick = endCall;
    
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
      document.getElementById('localVideo').srcObject = localStream;
      
      callDoc = await db.collection('calls').add({
        fromUserId: cur.uid,
        toUserId: u.uid,
        callerName: cur.nickname || cur.username,
        status: 'ringing',
        createdAt: new Date().toISOString()
      });
      
      peerConnection = new RTCPeerConnection(servers);
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
      
      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          callDoc.collection('offerCandidates').add(event.candidate.toJSON());
        }
      };
      
      peerConnection.ontrack = (event) => {
        const remoteVideo = document.getElementById('remoteVideo');
        if (remoteVideo) {
          remoteVideo.srcObject = event.streams[0];
          remoteVideo.style.display = 'block';
        }
      };
      
      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      await callDoc.update({ offer: { type: offer.type, sdp: offer.sdp } });
      
      // Ждем ответ
      callListener = callDoc.onSnapshot(async (snap) => {
        const data = snap.data();
        if (!data) return;
        
        if (data.status === 'declined') {
          endCall();
          toast('Абонент отклонил звонок', 'err');
          return;
        }
        
        if (data.answer && !peerConnection.currentRemoteDescription) {
          try {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
            
            // Получаем ICE кандидатов отвечающего
            callDoc.collection('answerCandidates').onSnapshot((candSnap) => {
              candSnap.docChanges().forEach(async (change) => {
                if (change.type === 'added' && peerConnection) {
                  try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
                  } catch(e) {}
                }
              });
            });
            
            startCallTimer();
            document.getElementById('callStatus').textContent = 'Разговор';
          } catch(e) {
            console.error(e);
          }
        }
      });
      
    } catch(e) {
      console.error(e);
      endCall();
      toast('Ошибка доступа к камере/микрофону', 'err');
    }
  };

  function startCallTimer() {
    callSec = 0;
    callTimer = setInterval(() => {
      callSec++;
      const m = Math.floor(callSec / 60).toString().padStart(2, '0');
      const s = (callSec % 60).toString().padStart(2, '0');
      const el = document.getElementById('callTimer');
      if (el) el.textContent = `${m}:${s}`;
    }, 1000);
  }

  window.toggleMute = () => {
    if (localStream) {
      const audioTrack = localStream.getAudioTracks()[0];
      if (audioTrack) {
        audioTrack.enabled = !audioTrack.enabled;
        const btn = document.getElementById('muteBtn');
        if (btn) btn.classList.toggle('active', !audioTrack.enabled);
      }
    }
  };

  window.endCall = async () => {
    if (window._ringInterval) clearInterval(window._ringInterval);
    if (callDoc) {
      try { await callDoc.update({ status: 'ended', endTime: new Date().toISOString() }); } catch(e) {}
      if (callListener) callListener();
      callDoc = null;
      callListener = null;
    }
    if (peerConnection) { peerConnection.close(); peerConnection = null; }
    if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
    if (callTimer) { clearInterval(callTimer); callTimer = null; }
    document.getElementById('callOverlay').classList.remove('show');
    document.getElementById('callOverlay').innerHTML = '';
    callSec = 0;
  };

  // Админ
  window.loadAdmin = async (tab = 'users', btn) => {
    document.querySelectorAll('#adminModal .btn').forEach(b => b.style.background = '');
    if (btn) btn.style.background = 'var(--primary)';
    const list = document.getElementById('adminList');
    if (!list) return;
    list.innerHTML = '<p>Загрузка...</p>';
    if (tab === 'reports') {
      const snap = await db.collection('reports').orderBy('createdAt', 'desc').get();
      list.innerHTML = '';
      for (const d of snap.docs) {
        const r = d.data();
        list.innerHTML += `<div style="padding:10px;margin:5px 0;background:var(--light);border-radius:10px;">
          <p>На: ${r.reportedUserId} | ${esc(r.reason)}</p>
          <button onclick="banU('${r.reportedUserId}')" style="background:var(--danger);color:#fff;border:none;padding:6px 12px;border-radius:8px;cursor:pointer;">Бан</button>
        </div>`;
      }
      return;
    }
    const snap = await db.collection('users').get();
    list.innerHTML = '';
    snap.forEach(doc => {
      const u = doc.data();
      if (doc.id === cur.uid) return;
      if (tab === 'banned' && !u.isBanned) return;
      if (tab === 'users' && u.isBanned) return;
      list.innerHTML += `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px;margin:5px 0;background:var(--light);border-radius:10px;">
        <div style="display:flex;align-items:center;gap:8px;">${avHTML(u,'s')}<strong>${esc(u.nickname||u.username)}</strong></div>
        <div>${!u.isBanned ? `<button onclick="banU('${doc.id}')" style="background:var(--danger);color:#fff;border:none;padding:6px 12px;border-radius:8px;cursor:pointer;">Бан</button>` : `<button onclick="unbanU('${doc.id}')" style="background:var(--success);color:#fff;border:none;padding:6px 12px;border-radius:8px;cursor:pointer;">Разбан</button>`}</div>
      </div>`;
    });
  };

  window.banU = async (uid) => { await db.collection('users').doc(uid).update({ isBanned: true }); toast('Забанен', 'err'); loadAdmin(); };
  window.unbanU = async (uid) => { await db.collection('users').doc(uid).update({ isBanned: false }); toast('Разбанен'); loadAdmin('banned'); };

  async function logout() {
    if (cur?.uid) await db.collection('users').doc(cur.uid).update({ online: false, lastSeen: firebase.firestore.FieldValue.serverTimestamp() });
    await auth.signOut();
  }
  window.logout = logout;
</script>
</body>
</html>
